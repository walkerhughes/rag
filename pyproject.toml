[project]
name = "rag"
version = "0.1.0"
description = "Agentic GraphRAG over speaker-attributed Dwarkesh Podcast transcripts"
readme = "README.md"
requires-python = ">=3.13"
# Each OpenTelemetry instrumentation package is added alongside the library it
# instruments. `opentelemetry-distro` is not used: it serves zero-code startup through
# the `opentelemetry-instrument` wrapper, and observability.py configures the SDK.
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opensearch-py>=2.8",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

# An application rather than a library: nothing installs into site-packages, and `src`
# is the import root.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["src", "apps"]
addopts = "--strict-markers --strict-config"
markers = ["integration: requires external services (Postgres, OpenSearch, network)"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
# What the unit suite reaches today. Raise it when a change earns it; never lower it to
# make a failing run pass.
fail_under = 66
