[project]
name = "rag"
version = "0.1.0"
description = "Agentic GraphRAG over speaker-attributed Dwarkesh Podcast transcripts"
readme = "README.md"
requires-python = ">=3.13"
# Instrumentation packages arrive with the library they instrument, not before it:
# psycopg with #4, an HTTP client with #6, ASGI with #10. `opentelemetry-distro` is
# deliberately absent because it exists for zero-code `opentelemetry-instrument`
# startup, and observability.py configures the SDK explicitly instead.
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

# ponytail: application, not a library. Nothing here installs into site-packages, so `src`
# is simply the import root. Revisit if a capability ever needs to ship standalone.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src"]
addopts = "--strict-markers --strict-config"
markers = ["integration: requires external services (Postgres, Neo4j, network)"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
